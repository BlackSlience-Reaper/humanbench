<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>你是几B的模型？｜HumanBench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Lilita+One&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141414; --paper:#FFF7E3; --white:#fff; --muted:#6b675e;
  --yellow:#FFE14D; --pink:#FF7EC3; --pink-soft:#FFE1F0; --green:#43E08B; --blue:#6C9BFF; --red:#FF5A4E; --purple:#B78CFF;
  --fun:"ZCOOL KuaiLe","Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --num:"Lilita One","Arial Black",Impact,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --serif:Georgia,"Times New Roman",serif;
  --line:3px solid var(--ink);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--sans);color:var(--ink);background:var(--paper);
  background-image:radial-gradient(rgba(20,20,20,.12) 1.2px,transparent 1.2px);background-size:18px 18px;
  min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:480px;margin:0 auto;padding:18px 16px 60px;position:relative;z-index:1}

/* ---------- shared ---------- */
.box{background:var(--white);border:var(--line);border-radius:20px;box-shadow:6px 6px 0 var(--ink)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:var(--line);border-radius:16px;background:var(--yellow);
  box-shadow:5px 5px 0 var(--ink);font-family:var(--fun);font-size:24px;padding:16px 18px;transition:transform .08s,box-shadow .08s;text-decoration:none}
.btn:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
.btn.pink{background:var(--pink)} .btn.white{background:var(--white)} .btn.green{background:var(--green)}
.btn.small{font-size:18px;padding:12px 14px}
.sticker{display:inline-block;border:var(--line);border-radius:999px;padding:4px 12px;background:var(--white);font-family:var(--fun);font-size:16px;box-shadow:3px 3px 0 var(--ink);white-space:nowrap}
.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.floaty{animation:floaty 3.2s ease-in-out infinite}
@keyframes floaty{50%{translate:0 -8px}}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.logo{font-family:var(--mono);font-weight:900;font-size:15px;background:var(--ink);color:var(--yellow);border-radius:8px;padding:0 8px;line-height:28px}
.progress{flex:1;height:18px;border:var(--line);border-radius:999px;background:var(--white);overflow:hidden;position:relative}
.progress > div{height:100%;background:repeating-linear-gradient(-45deg,var(--green) 0 10px,#2fc976 10px 20px);transition:width .4s}
.progress span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}

/* ---------- home ---------- */
.bg-stickers{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
@media (max-width:900px){.bg-stickers{display:none!important}}
.strip{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 10px;margin:18px 0 0}
.strip b{font:900 13px var(--sans);background:var(--white);border:2.5px solid var(--ink);border-radius:9px;padding:3px 9px;box-shadow:3px 3px 0 var(--ink)}
.strip b.m{font-family:var(--mono)}
.strip b:nth-child(1){rotate:-4deg;background:#FFE3F1}.strip b:nth-child(2){rotate:3deg;background:#E6FFF0}.strip b:nth-child(3){rotate:-2deg;background:#E3F0FF}
@media (min-width:901px){.strip{display:none}}
.bg-stickers b{position:absolute;font:900 15px var(--sans);background:var(--white);border:3px solid var(--ink);border-radius:10px;padding:3px 9px;box-shadow:3px 3px 0 var(--ink);white-space:nowrap}
.bg-stickers b.m{font-family:var(--mono)}
.hero{text-align:center;padding-top:22px}
.hero .kicker{transform:rotate(-3deg);background:var(--green)}
.hero h1{font-family:var(--fun);font-weight:400;font-size:66px;line-height:1.05;margin:22px 0 8px;letter-spacing:1px}
.hero h1 .hl{background:var(--yellow);border:var(--line);border-radius:14px;padding:0 10px;display:inline-block;transform:rotate(-2deg);box-shadow:5px 5px 0 var(--ink)}
.hero h1 .b{font-family:var(--num);color:var(--pink);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.hero .sub{font-size:18px;font-weight:700;margin:22px 0 6px}
.hero .sub2{font-size:15px;color:var(--muted);margin:0 0 24px}
.fails{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 22px;text-align:left}
.fail{padding:12px 12px 10px;border-radius:16px}
.fail:nth-child(1){transform:rotate(-2deg);background:#FFE3F1}
.fail:nth-child(2){transform:rotate(1.5deg);background:#E3F0FF}
.fail:nth-child(3){transform:rotate(1deg);background:#E6FFF0}
.fail:nth-child(4){transform:rotate(-1.5deg);background:#FFF3C4}
.fail b{display:block;font-size:15px;line-height:1.35}
.fail small{display:block;margin-top:6px;font-size:13px;color:var(--muted)}
.gets{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:0 0 22px}
.gets span{font-size:13px;font-weight:900;border:2px solid var(--ink);border-radius:8px;padding:3px 9px;background:var(--white)}
.gets span:nth-child(1){background:var(--pink-soft)} .gets span:nth-child(2){background:#E3F0FF} .gets span:nth-child(3){background:#FFF3C4}
.fine{font-size:12px;color:var(--muted);text-align:center;margin-top:16px}

/* ---------- question ---------- */
.qcard{padding:20px 18px 18px;margin-top:6px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.sec{display:inline-block;max-width:78%;font-size:12px;font-weight:900;border:2px solid var(--ink);border-radius:8px;padding:3px 8px;background:var(--purple);transform:rotate(-1.5deg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec.traps{background:var(--yellow)} .sec.persona{background:var(--pink)}
.qnum{font-family:var(--num);font-size:20px;white-space:nowrap}
.qnum small{font-size:13px;color:var(--muted)}
.qtext{font-size:21px;font-weight:900;line-height:1.5;margin:4px 0 14px}
.term,.code{margin:0 0 14px;border:var(--line);border-radius:12px;padding:12px 14px;font:600 13.5px/1.6 var(--mono);white-space:pre-wrap;word-break:break-all}
.term{background:#161616;color:#E6E6E6}
.term::before{content:"● ● ●";display:block;color:#666;font-size:10px;letter-spacing:2px;margin-bottom:6px}
.code{background:#F3F0FF}
.mail{border:2px dashed var(--ink);border-radius:12px;background:#FFFBEF;padding:12px;font-size:15px;line-height:1.6;margin:-4px 0 16px}
.mail .inj{background:#FFD8D4;border-radius:4px;padding:0 3px}
.chart-svg{width:100%;height:auto;display:block;border:var(--line);border-radius:12px;background:#fff;margin:0 0 16px}
.c-title{font:900 12px var(--sans);fill:var(--ink)}
.c-axis{stroke:var(--ink);stroke-width:2.5}
.c-grid{stroke:#ddd;stroke-width:1;stroke-dasharray:3 3}
.c-tick{font:700 10px var(--sans);fill:#666}
.c-lab{font:700 11px var(--sans);fill:var(--ink)}
.c-val{font:900 12px var(--sans);fill:var(--ink)}
.c-bar1{fill:var(--pink);stroke:var(--ink);stroke-width:2.5}
.c-bar2{fill:#D9D4C6;stroke:var(--ink);stroke-width:2.5}
.c-line{fill:none;stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.c-dot{fill:var(--yellow);stroke:var(--ink);stroke-width:2.5}
.c-area{fill:#FFD0CC}
.c-slice{stroke:var(--ink);stroke-width:2.5}

.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;border:var(--line);border-radius:14px;background:var(--white);box-shadow:4px 4px 0 var(--ink);
  font-size:16.5px;font-weight:700;padding:13px 14px;transition:transform .08s,box-shadow .08s,background .15s}
.opt:not([disabled]):active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.opt .k{flex:none;width:30px;height:30px;border:var(--line);border-radius:50%;display:grid;place-items:center;font-family:var(--num);font-size:16px;background:var(--yellow)}
.opt[disabled]{cursor:default}
[data-opt].dim{opacity:.35}
.opt.picked{background:var(--yellow)}
.opt.answer{border-style:dashed;position:relative}
.opt.alsook{border-style:dashed}
.opt.alsook::after{content:"也对";margin-left:auto;flex:none;font-size:11px;font-weight:900;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:6px;padding:1px 7px}
.hs.alsook{outline:3px dashed var(--ink);outline-offset:3px;border-radius:8px}
.verdict{display:inline-block;font-size:13px;font-weight:900;background:var(--ink);color:#fff;border-radius:6px;padding:2px 9px;margin-bottom:4px}
.opt.answer::after{content:"正解";margin-left:auto;flex:none;font-size:11px;font-weight:900;background:var(--ink);color:var(--yellow);border-radius:6px;padding:2px 7px}

/* mock UIs */
.mock{border:var(--line);border-radius:14px;overflow:hidden;background:#fff;margin-bottom:6px}
.mock-bar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:#EEE9DA;border-bottom:var(--line)}
.mock-bar i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);background:#fff}
.mock-bar b{margin-left:8px;font:700 12px var(--mono);color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mock-body{padding:16px;position:relative}
.hs{border:0;background:none;padding:0}
.hs.picked{outline:4px solid var(--yellow);outline-offset:3px;border-radius:8px;box-shadow:0 0 0 7px var(--ink)}
.hs.answer{outline:3px dashed var(--ink);outline-offset:3px;border-radius:8px}
.popup{background:linear-gradient(#FF4D4D,#FF8A3D);color:#fff;text-align:center;padding:26px 16px 14px}
.x-btn{position:absolute;top:6px;right:8px;width:24px;height:24px;color:rgba(255,255,255,.55);font-size:15px;line-height:24px}
.pp-t{font-weight:900;font-size:15px}
.pp-amt{font-family:var(--num);font-size:48px;margin:6px 0 10px;text-shadow:3px 3px 0 rgba(0,0,0,.2)}
.pp-amt small{font-family:var(--sans);font-size:15px;font-weight:900}
.pp-big{display:block;width:100%;background:#FFE14D;color:#B3261E;font-weight:900;font-size:20px;border-radius:999px;padding:12px;border:3px solid #fff}
.pp-agree{display:flex;align-items:center;justify-content:center;gap:6px;margin:12px auto 6px;font-size:12px;color:#fff}
.fakebox{width:16px;height:16px;border:2px solid currentColor;border-radius:4px;display:inline-grid;place-items:center;font-size:12px;line-height:1;flex:none}
.fakebox.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pp-no{font-size:11px;color:rgba(255,255,255,.6);margin-top:4px;padding:4px 8px}
.dl{display:flex;flex-direction:column;gap:10px}
.dl-h{font-weight:900;font-size:15px}
.dl-ad{position:relative;display:block;width:100%;color:#fff;font:900 18px var(--sans);border-radius:10px;padding:13px;border:3px solid var(--ink)}
.dl-ad.g{background:#1FAA59} .dl-ad.o{background:#F2711C} .dl-ad.b{background:#2F6FE0}
.adtag{position:absolute;right:6px;top:4px;font-size:9px;background:rgba(0,0,0,.35);border-radius:3px;padding:0 4px}
.dl-small{font-size:12px;color:#555}
.dl-link{color:#1a57d6;text-decoration:underline;font-size:12px;padding:2px}
.form{display:flex;flex-direction:column;gap:14px}
.cb-row{display:flex;gap:10px;align-items:flex-start;text-align:left;font-size:15px;line-height:1.5;padding:4px}
.cb-row .fakebox{margin-top:3px}
.form-btn{background:var(--ink);color:#fff;border-radius:10px;padding:12px;font-weight:900}
.urls{display:flex;flex-direction:column;gap:10px}
.url{display:flex;align-items:center;gap:8px;width:100%;border:var(--line);border-radius:999px;background:#fff;padding:10px 14px;font:700 13px var(--mono);text-align:left;box-shadow:3px 3px 0 var(--ink);word-break:break-all}
.url .lock{width:10px;height:12px;border:2px solid #2a8a4a;border-radius:2px;flex:none}
.url.picked,.url.answer{border-radius:999px}
.ui-hint{font-size:12px;color:var(--muted);margin:10px 0 0}
/* ARC-AGI */
.arc-ex{display:flex;flex-direction:column;gap:10px;margin:0 0 16px;padding:12px;border:var(--line);border-radius:14px;background:#F4F2EC}
.arc-pair{display:grid;grid-template-columns:34px 1fr 20px 1fr;align-items:center;gap:8px}
.arc-pair b{text-align:center;font-family:var(--num);font-size:20px}
.arc-pair.test{padding-top:10px;border-top:2px dashed #bbb}
.arc-no{font-size:11px;font-weight:900;color:var(--muted)}
.arc-pair.test .arc-no{color:var(--ink)}
.arc-grid{display:grid;gap:2px;background:#444;border:2px solid var(--ink);padding:2px;width:100%;max-width:100%;box-sizing:border-box;justify-self:center}
.arc-grid i{display:block;aspect-ratio:1}
.arc-grid.mini{max-width:100%}
.arc-q{justify-self:center;width:64px;height:64px;border:3px dashed var(--ink);border-radius:10px;display:grid;place-items:center;font:400 34px var(--num);background:#fff}
.arc-opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt.arc-opt{flex-direction:column;align-items:center;gap:8px;padding:12px 10px}
.opt.arc-opt .k{align-self:flex-start}
/* cookie */
.news{background:#F4F2EC;padding:12px}
.news-fake{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.news-fake span{height:9px;border-radius:4px;background:#DDD8CC}.news-fake span.s{width:60%}
.cookie{position:relative;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:14px 12px 12px;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.ck-x{position:absolute;top:4px;right:8px;width:24px;height:24px;font-size:16px;color:#999}
.ck-t{font-weight:900;font-size:15px;margin-bottom:4px}
.ck-p{font-size:12px;color:#555;line-height:1.5;margin-bottom:10px}
.ck-all{display:block;width:100%;background:#1a57d6;color:#fff;font-weight:900;font-size:16px;border-radius:8px;padding:11px}
.ck-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.ck-set{font-size:13px;font-weight:700;color:#1a57d6;padding:4px}
.ck-min{font-size:11px;color:#aaa;padding:4px}
/* mail */
.mail-ui{padding:12px}
.mu-from{font-size:12px;color:#555;margin-bottom:10px}
.mu-banner{background:linear-gradient(135deg,#FF3D3D,#FF9F1C);color:#fff;border-radius:10px;padding:18px 12px;text-align:center;font:900 20px var(--sans);line-height:1.3}
.mu-banner span{font-family:var(--num);font-weight:400;font-size:34px}
.mu-buy{display:block;width:100%;margin:10px 0;background:var(--ink);color:#fff;font-weight:900;font-size:16px;border-radius:999px;padding:11px}
.mu-foot{font-size:10.5px;color:#aaa;line-height:1.9;text-align:center}
.mu-link,.mu-unsub{font-size:10.5px;color:#aaa;text-decoration:underline;padding:1px 2px}
/* virus */
.tabs{display:flex;gap:4px;padding:6px 8px 0;background:#DCD7C9;border-bottom:var(--line)}
.tab{font-size:11.5px;font-weight:700;padding:6px 10px;border:2px solid var(--ink);border-bottom:0;border-radius:8px 8px 0 0;background:#EEE9DA;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tab.on{background:#fff}
.tab-x{width:18px;height:18px;border-radius:50%;font-size:13px;line-height:18px;color:#666}
.virus{background:#B3001B;color:#fff;text-align:center;padding:18px 14px}
.vi-tri{width:0;height:0;margin:0 auto 8px;border-left:26px solid transparent;border-right:26px solid transparent;border-bottom:44px solid #FFE14D;position:relative;font:900 26px/58px var(--sans);color:var(--ink);text-indent:-7px}
.vi-t{font-weight:900;font-size:19px}
.vi-p{font-size:12.5px;margin:6px 0 12px;opacity:.9}
.vi-btn{display:block;width:100%;background:#FFE14D;color:#B3001B;font-weight:900;font-size:18px;border-radius:8px;padding:12px;border:3px solid #fff}
.vi-btn2{display:block;width:100%;margin-top:8px;background:#fff;color:#B3001B;font-weight:900;font-size:14px;border-radius:8px;padding:9px}
.vi-tel{margin-top:10px;font-size:12px;color:#fff;text-decoration:underline;padding:2px}
/* cancel */
.cancel{text-align:center;padding:18px 14px}
.ca-t{font-weight:900;font-size:20px}
.ca-p{font-size:12.5px;color:#666;line-height:1.6;margin:6px 0 14px}
.ca-keep{display:block;width:100%;background:#F0B429;color:var(--ink);font-weight:900;font-size:17px;border-radius:999px;padding:12px;border:3px solid var(--ink)}
.ca-pause{display:block;width:100%;margin-top:8px;border:2px solid var(--ink);border-radius:999px;padding:9px;font-weight:700;font-size:14px}
.ca-go{margin-top:12px;font-size:11px;color:#bbb;padding:3px 6px}
/* permission */
.phone{border:var(--line);border-radius:26px;background:linear-gradient(#5B7CFA,#9A6BFF);padding:10px 14px 18px;max-width:290px;margin:0 auto 6px}
.ph-bar{color:#fff;font:700 11px var(--sans);text-align:center;margin-bottom:24px}
.perm{background:rgba(255,255,255,.96);border-radius:16px;padding:16px 14px 10px;text-align:center}
.pe-icon{width:40px;height:40px;border-radius:10px;background:#FFE14D;border:2px solid var(--ink);margin:0 auto 8px;position:relative}
.pe-icon::after{content:"";position:absolute;left:14px;top:8px;width:8px;height:20px;border-radius:3px;background:var(--ink)}
.pe-t{font-weight:900;font-size:15px}
.pe-list{font-size:12.5px;color:#555;margin:6px 0 12px}
.pe-btn{display:block;width:100%;border-top:1px solid #ddd;padding:11px;font-size:15px;color:#1a57d6;font-weight:500}
.pe-btn.pri{font-weight:900}
/* search */
.serp{display:flex;flex-direction:column;gap:10px;padding:12px}
.se-q{border:2px solid var(--ink);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px}
.se-r{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:4px}
.se-r b{color:#1a0dab;font-size:14.5px;font-weight:700;line-height:1.35}
.se-r small{color:#1f7a3a;font-size:11.5px}
.se-ad{font-size:10px;font-weight:900;border:1.5px solid #333;border-radius:3px;padding:0 4px;margin-bottom:2px}
/* checkout */
.order{display:flex;flex-direction:column;gap:10px;padding:14px}
.or-item{display:flex;justify-content:space-between;font-size:15px;font-weight:700;padding-bottom:8px;border-bottom:1.5px dashed #ccc}
.or-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;text-align:left;font-size:13.5px;padding:4px}
.or-row small{flex-basis:100%;padding-left:24px;font-size:10.5px;color:#aaa}
.or-row em{margin-left:auto;font-style:normal;font-weight:700}
.or-total{text-align:right;font-size:14px}.or-total b{font-size:20px;color:#E4393C}
.or-submit{background:#E4393C;color:#fff;font-weight:900;font-size:17px;border-radius:999px;padding:12px}
/* fake ad */
.adbox{padding:12px;background:#F4F2EC}
.ad-img{position:relative;display:block;width:100%;border-radius:12px;padding:26px 14px 20px;background:linear-gradient(135deg,#FF6B6B,#FFB347);color:#fff;text-align:center}
.ad-img b{display:block;font:900 26px var(--sans)}
.ad-img small{display:block;font-size:14px;font-weight:700;margin-top:4px}
.ad-x{position:absolute;top:6px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;font-size:20px;line-height:30px}
.ad-foot{display:flex;justify-content:space-between;margin-top:6px}
.ad-why,.ad-real{font-size:11px;color:#999;padding:4px}
/* sms */
.sms{background:#fff;border-radius:16px;padding:6px 0;text-align:left}
.sms-i{display:flex;flex-direction:column;gap:3px;width:100%;padding:10px 14px;border-bottom:1px solid #eee;text-align:left}
.sms-i b{font-size:13px}
.sms-i span{font-size:12.5px;color:#555;line-height:1.5}
/* dialogs */
.dialog{border:var(--line);border-radius:16px;background:#F7F6F3;padding:18px 16px 14px;text-align:center;box-shadow:0 10px 26px rgba(0,0,0,.18);margin-bottom:6px}
.dl-ic{width:40px;height:40px;border-radius:50%;background:#FFB020;border:2px solid var(--ink);margin:0 auto 10px;font:900 24px/36px var(--sans)}
.dl-t{font-weight:900;font-size:15px;line-height:1.5}
.dl-p{font-size:13px;color:#666;margin:6px 0 14px}
.dl-p.big{font-size:17px;color:var(--ink);font-weight:700;margin:10px 0 18px}
.dl-btns{display:flex;gap:10px}
.dg-btn{flex:1;border:2px solid var(--ink);border-radius:10px;padding:10px;font-weight:900;font-size:15px;background:#fff}
.dg-btn.pri{background:#1a57d6;color:#fff}
.ending.end-persona .stamp{background:var(--blue)}
.thinkbox{align-self:flex-end;max-width:88%;border-left:4px solid #bbb;background:#F4F2EC;border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.55;color:#6b675e;font-style:italic}
.thinkbox b{display:block;font-style:normal;font-size:11px;color:#8a857a;margin-bottom:2px}
.opt .bt,.bubble .bt{display:block;font-size:12px;font-weight:500;font-style:italic;color:#8a857a;border-left:3px solid #ccc;padding-left:8px;margin-bottom:6px}
.idtag{display:inline-block;margin:0 0 8px;font:400 17px var(--fun);background:var(--ink);color:var(--yellow);border-radius:8px;padding:2px 10px;transform:rotate(-2deg)}
.idtag.big{font-size:20px;margin:10px 0 0 10px}
.scene-log .thinkbox{font-size:12px}
.slop{margin:-4px 0 16px;padding:12px 14px;border-left:5px solid var(--ink);background:#F4F2EC;border-radius:0 12px 12px 0;font-size:15px;line-height:1.7;font-weight:500}
.flavor{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flavor b{flex-basis:100%;font-family:var(--fun);font-weight:400;font-size:19px}
.flavor span{font-size:12px;font-weight:900;border:2px solid var(--ink);border-radius:8px;padding:2px 8px;background:#fff}
.glyph{font-size:34px}
.rp{display:flex;flex-direction:column;gap:8px;margin:4px 0 16px}
.rp .scene{align-self:flex-start;margin:0}
.rp .msg{font-size:16.5px}
.rp-ask{font-size:13px;font-weight:900;color:var(--muted);text-align:right}
.slang.long{font-size:17px}
.lvl{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:1px;margin:-6px 0 6px}
.lvl.boss{display:inline-block;color:var(--yellow);background:var(--ink);border-radius:6px;padding:1px 8px}
/* architecture card */
.arch-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.arch-stats div{border:2px solid var(--ink);border-radius:12px;padding:8px 6px;text-align:center;background:#FBF9F2}
.arch-stats b{display:block;font-family:var(--num);font-weight:400;font-size:24px;line-height:1.1}
.arch-stats span{font-size:10.5px;font-weight:700;color:var(--muted)}
.experts{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:10px}
.experts span{font-size:11px;font-weight:900;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:2px!important;padding-right:2px!important;border:2px solid var(--ink);border-radius:8px;padding:5px 0;background:#F0ECE0;color:#9a958a}
.experts span.hot{background:var(--pink);color:var(--ink)}
.experts span.mid{background:var(--yellow);color:var(--ink)}
.experts span.cold{background:#fff;color:#bbb;border-style:dashed}
.arch-line{font-size:13.5px;line-height:1.6;font-weight:500;margin-bottom:12px}
.ladder{display:grid;grid-template-columns:repeat(16,1fr);gap:3px}
.ladder i{height:12px;border:1.5px solid var(--ink);border-radius:3px;background:#fff}
.ladder i.past{background:#FFD0E8}.ladder i.on{background:var(--pink);transform:scaleY(1.6)}
.ladder-lab{display:flex;justify-content:space-between;font:700 10px var(--mono);color:var(--muted);margin-top:4px}
/* share */
.p-bottom small{display:block}
.p-bottom small.author{margin-top:4px;font-weight:900;color:var(--ink)}
.p-bottom .qr{flex:none;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:4px;min-width:62px;min-height:62px;display:grid;place-items:center}
.p-bottom .qr img{display:block;width:84px;height:84px;image-rendering:pixelated}
.follow{display:block;text-align:center;font-size:13px;font-weight:900;color:var(--ink);text-decoration:underline;text-underline-offset:3px;margin-top:10px}
.share-card{padding:14px;display:flex;flex-direction:column;gap:8px}
.share-card textarea{width:100%;min-height:96px;font:500 13px/1.5 var(--sans);border:2px solid var(--ink);border-radius:10px;padding:8px;resize:none}
.share-card small{color:var(--muted);font-size:12px}
.challenge{padding:14px 14px 12px;margin:0 0 20px;text-align:left;background:#FFF0F7;transform:rotate(-1deg)}
.ch-k{font:900 11px var(--mono);letter-spacing:1px;color:var(--muted)}
.ch-name{font:900 20px var(--sans);margin:4px 0 8px;overflow-wrap:anywhere}
.ch-row{display:flex;flex-wrap:wrap;gap:6px}
.ch-row span{font-size:12px;font-weight:900;border:2px solid var(--ink);border-radius:8px;padding:2px 8px;background:#fff}
.ch-q{font-family:var(--fun);font-size:20px;margin:10px 0}

/* reaction */
.react{margin-top:18px;padding:18px;position:relative}
.react-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.react-top .slang{margin-bottom:0}.react-top .think{margin-bottom:0}
.stamp{position:absolute;top:-20px;right:14px;font-family:var(--fun);font-size:24px;padding:3px 14px;border:var(--line);border-radius:12px;box-shadow:4px 4px 0 var(--ink);transform:rotate(6deg)}
.react.ok .stamp{background:var(--green)} .react.no .stamp{background:var(--red);color:#fff}
.slang{width:62px;height:62px;border:var(--line);border-radius:50%;display:grid;place-items:center;font-family:var(--fun);font-size:30px;transform:rotate(-8deg);box-shadow:3px 3px 0 var(--ink);margin-bottom:10px}
.react .slang{background:var(--yellow)}
.slang.long{font-size:18px}
.think{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px}
.think::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.react p{margin:0 0 16px;font-size:16.5px;line-height:1.65;font-weight:500}

/* persona chat */
.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:84%;padding:11px 14px;border:var(--line);border-radius:18px;font-size:16px;line-height:1.5;font-weight:700}
.msg.user{align-self:flex-start;background:#EEE9DA;border-bottom-left-radius:4px}
.chat .ask{font-size:13px;font-weight:900;color:var(--muted);text-align:right;margin-top:6px}
.bubble{align-self:flex-end;max-width:88%;text-align:left;padding:12px 14px;border:var(--line);border-radius:18px;border-bottom-right-radius:4px;background:var(--white);
  font-size:15.5px;line-height:1.55;font-weight:700;box-shadow:4px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s,opacity .2s,background .15s}
.bubble:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.bubble.sent{background:var(--green)}
.bubble.gone{opacity:.25}
.read{align-self:flex-end;font-size:11px;font-weight:900;color:var(--muted)}
.sec.vibe{background:var(--blue)} .sec.chat{background:var(--green)}
.scene{display:inline-block;font:900 11px var(--mono);letter-spacing:.5px;background:var(--ink);color:var(--yellow);border-radius:6px;padding:3px 8px;margin:-2px 0 12px}
.msg.me{align-self:flex-end;background:var(--green);border-bottom-right-radius:4px;border-bottom-left-radius:18px;font-weight:700}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.typing{align-self:flex-start;display:flex;gap:5px;padding:12px 14px;border:var(--line);border-radius:18px;border-bottom-left-radius:4px;background:#EEE9DA}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.2}}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tags span{font-size:12px;font-weight:900;border:2px solid var(--ink);border-radius:999px;padding:2px 9px;background:var(--yellow);transform:rotate(-2deg)}
.chat > .tags{align-self:flex-end}
.btn.cont{margin-top:8px}
.review,.ending{position:relative;padding:18px 16px 14px;margin-top:14px;background:#EEF3FF}
.review p,.ending p{margin:0 0 8px;font-size:16px;line-height:1.6;font-weight:500}
.review .stamp{background:var(--blue)}
.ending{background:#FFF7DC}
.ending .stamp{background:var(--pink)}
.end-title{font-family:var(--fun);font-size:26px;margin-bottom:6px}
.trait-row,.end-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.trait-row span{font-size:12.5px;font-weight:900;border:2px solid var(--ink);border-radius:999px;padding:2px 10px;background:var(--white)}
.trait-row span.top{background:var(--yellow);font-size:14px}
.end-row span{font-size:12px;font-weight:700;border:2px dashed var(--ink);border-radius:8px;padding:2px 8px;background:#FFF0F7}
.end-row span.g{background:#E8FFF1}
.scene-log{display:flex;flex-direction:column;gap:8px}
.scene-log .msg{font-size:13.5px;padding:8px 12px;max-width:88%}
.scene-end{margin-top:12px;display:inline-block;font-family:var(--fun);font-size:19px;background:var(--pink);color:var(--on-pink,var(--ink));border:var(--line);border-radius:10px;padding:2px 12px;box-shadow:3px 3px 0 var(--ink);transform:rotate(-2deg)}
.scene-end.good{background:var(--green)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(20,20,20,.55);display:grid;place-items:center;z-index:50;padding:20px}
.modal .box{max-width:400px;width:100%;padding:24px 20px 20px;text-align:center}
.modal .big{font-family:var(--num);font-size:64px;line-height:1;color:var(--pink);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.modal h3{font-family:var(--fun);font-weight:400;font-size:28px;margin:10px 0 6px}
.modal p{margin:0 0 20px;font-size:16px;line-height:1.6}
.modal .btn + .btn{margin-top:12px}

/* captcha / name */
.center{text-align:center}
.bigmark{display:inline-block;margin:30px 0 14px;font:900 14px var(--mono);letter-spacing:2px;border:var(--line);border-radius:10px;padding:8px 14px;background:var(--blue);box-shadow:4px 4px 0 var(--ink);transform:rotate(-3deg)}
.h2{font-family:var(--fun);font-weight:400;font-size:34px;margin:6px 0 10px;line-height:1.2}
.captcha{display:flex;align-items:center;gap:14px;padding:18px;margin:26px 0;text-align:left;width:100%}
.cb{width:36px;height:36px;border:var(--line);border-radius:8px;background:var(--white);display:grid;place-items:center;flex:none;font:900 22px var(--sans)}
.cb.spin{border-radius:50%;border-color:var(--ink) transparent var(--ink) transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.captcha b{font-size:19px}
.captcha small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.alert{background:#FFECEA;padding:16px 16px 14px;margin-bottom:22px;text-align:left}
.alert .t{font-family:var(--fun);font-size:22px;display:block;margin-bottom:6px}
.alert p{margin:0;line-height:1.6}
.namein{width:100%;font:900 22px var(--sans);padding:14px 16px;border:var(--line);border-radius:14px;box-shadow:4px 4px 0 var(--ink);background:var(--white);outline:none;margin:10px 0 18px;text-align:center}
.namegen{display:flex;flex-direction:column;gap:10px;margin:-6px 0 20px;text-align:left}
.ng-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.ng-row > span{flex-basis:100%;font-size:11.5px;font-weight:900;color:var(--muted)}
.ng-row > div{display:flex;flex-wrap:wrap;gap:6px}
.ng-row button{border:2px solid var(--ink);border-radius:999px;background:var(--white);padding:4px 11px;font-size:13.5px;font-weight:700}
.ng-row #ngP button{background:var(--yellow)}
.ng-more{background:var(--ink)!important;color:var(--yellow)}
.p-name.long{font-size:26px}
.presets{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:-4px 0 20px}
.presets button{border:2px solid var(--ink);border-radius:999px;background:var(--white);padding:4px 12px;font-size:14px;font-weight:700}

/* ---------- poster ---------- */
#poster{background:var(--paper);border:var(--line);border-radius:22px;overflow:hidden;box-shadow:6px 6px 0 var(--ink)}
.p-top{background:var(--ink);color:var(--white);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:1px}
.p-top .live{display:flex;align-items:center;gap:6px;color:var(--yellow);font-weight:900}
.p-top .live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red)}
.p-hero{padding:22px 18px 6px}
.p-intro{font-family:var(--fun);font-size:20px}
.p-name{font-weight:900;font-size:34px;line-height:1.15;margin:6px 0 14px;overflow-wrap:anywhere}
.p-name .suf{display:block;font-family:var(--num);font-weight:400;font-size:22px;margin-top:6px}
.p-name .suf span{display:inline-block;background:var(--yellow);border:2px solid var(--ink);border-radius:8px;padding:0 8px;margin:4px 6px 0 0;white-space:nowrap}
.p-size{display:flex;align-items:flex-end;gap:14px}
.p-size .num{font-family:var(--num);font-size:100px;line-height:.9;color:var(--pink);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink)}
.p-size .lbl{padding-bottom:10px}
.p-size .lbl .sticker{background:var(--green);transform:rotate(-4deg);margin-bottom:8px}
.p-size .lbl div{font-size:12px;font-weight:700;color:var(--muted)}
.p-roast{margin:14px 0 10px;font-size:16.5px;font-weight:700;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:12px;font-weight:700;border:2px solid var(--ink);border-radius:8px;padding:2px 8px;background:var(--white)}
.chips span b{font-weight:900}
.chips span.badge{background:var(--blue)}
.p-sec{margin:16px 14px 0;padding:16px 14px}
.p-sec h4{margin:0;font-family:var(--fun);font-weight:400;font-size:21px}
.p-sec .sub{font-size:11.5px;color:var(--muted);font-weight:700;margin:2px 0 12px}
.p-kicker{font:900 10.5px var(--mono);letter-spacing:1px;color:var(--muted);margin-bottom:4px}

.persona{display:flex;gap:14px;align-items:center}
.glyph{flex:none;width:74px;height:74px;border:var(--line);border-radius:18px;display:grid;place-items:center;font:400 40px var(--num);color:#fff;box-shadow:4px 4px 0 var(--ink);transform:rotate(-4deg)}
.glyph.cjk{font:400 38px var(--fun)}
.persona .pn{font-family:var(--fun);font-size:23px;line-height:1.15;white-space:nowrap}
.persona .pk{font-size:13px;font-weight:900;margin-top:6px}
.persona .pk span{background:var(--yellow);border:2px solid var(--ink);border-radius:6px;padding:0 6px;margin-left:4px}
.p-line{font-size:15px;font-weight:700;margin:12px 0 2px}
.evidence{margin:8px 0 10px;display:flex;flex-direction:column;gap:6px}
.evidence span{font-size:11.5px;font-weight:900;color:var(--muted)}
.evidence q{display:block;font-size:13.5px;line-height:1.55;font-weight:700;background:#F4F2EC;border-left:4px solid var(--ink);border-radius:0 8px 8px 0;padding:6px 10px;quotes:"“" "”"}
.p-proast{font-size:13.5px;color:var(--muted);margin:0 0 12px}
.axes{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.ax .al{display:flex;justify-content:space-between;font-size:10.5px;font-weight:700;color:var(--muted);margin-bottom:4px}
.ax .al b{color:var(--ink);font-weight:900}
.ax .track{height:8px;border:2px solid var(--ink);border-radius:99px;background:#F0ECE0;position:relative}
.ax .track i{position:absolute;top:50%;width:14px;height:14px;border:2px solid var(--ink);border-radius:50%;background:var(--pink);transform:translate(-50%,-50%)}

.tbl-wrap{margin:0 -4px}
table.lt{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed}
.lt th,.lt td{border:1.5px solid var(--ink);padding:6px 4px;text-align:left;vertical-align:top}
.lt th:first-child{width:30%}
.lt thead th{font-size:10.5px;line-height:1.25;font-weight:900;background:#FBF9F2;vertical-align:bottom}
.lt td.rl b{display:block;font-size:10.5px;line-height:1.25;overflow-wrap:anywhere}
.lt td.rl span{display:block;font-size:9px;color:var(--muted);line-height:1.25;margin-top:2px}
.lt td.v{font-weight:500;white-space:nowrap;font-size:10.5px;letter-spacing:-.2px;font-variant-numeric:tabular-nums}
.lt .you{border-left:4px solid var(--pink);border-right:4px solid var(--pink);font-weight:900}
.lt thead .you{border-top:4px solid var(--pink);background:var(--pink-soft)}
.lt tr:last-child .you{border-bottom:4px solid var(--pink)}
.lt td.win{font-weight:900}
.lt td.you.win{background:var(--pink-soft)}
.lt td.win:not(.you){background:#DEDAD0}
.lt thead .you small{display:block;font-size:9px;font-weight:700;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lt sup{font-size:8px}

.aa-title{font-family:var(--serif);font-size:19px;line-height:1.2}
.aa-plot{position:relative;height:190px;margin:30px 0 0 30px;display:flex;align-items:flex-end;gap:5px;border-bottom:1.5px dashed #bbb}
.aa-grid{position:absolute;left:0;right:0;border-top:1.5px dashed #e2ded3}
.aa-col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;position:relative;z-index:1}
.aa-bar{border-radius:4px 4px 0 0;display:flex;justify-content:center;padding-top:4px;color:#fff;font:700 10.5px var(--sans)}
.aa-col.me .aa-bar{background:var(--pink)!important;border:2.5px solid var(--ink);border-bottom:0;color:var(--ink);font-weight:900;font-size:11px}
.aa-call{position:absolute;left:50%;transform:translateX(-50%) rotate(-4deg);font:400 13px var(--fun);background:var(--yellow);border:2px solid var(--ink);border-radius:8px;padding:1px 7px;white-space:nowrap;box-shadow:2px 2px 0 var(--ink)}
.aa-labs{display:flex;gap:5px;margin-left:30px;height:92px}
.aa-lab{flex:1;position:relative}
.aa-lab span{position:absolute;right:50%;top:3px;transform-origin:right center;transform:rotate(-55deg);white-space:nowrap;font:600 10px var(--sans);color:#333}
.aa-lab.me span{font-weight:900;color:var(--ink);background:var(--yellow);padding:0 3px}
.foot{font-size:10.5px;color:var(--muted);margin-top:10px;line-height:1.55}
.issues{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.issues li{font-size:13.5px;line-height:1.5;padding-left:22px;position:relative}
.issues li::before{content:"!";position:absolute;left:0;top:2px;width:15px;height:15px;border-radius:50%;background:var(--red);color:#fff;font:900 10px/15px var(--sans);text-align:center}
.issues.clean li::before{content:"✓";background:var(--green);color:var(--ink)}
.p-bottom{margin-top:16px;padding:16px 18px 18px;background:var(--yellow);border-top:var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.p-bottom b{font-family:var(--fun);font-weight:400;font-size:20px;display:block}
.p-bottom small{font-size:12px;font-weight:700;color:#5c5530}
.p-bottom .mark{font-family:var(--mono);font-weight:900;background:var(--ink);color:var(--yellow);border-radius:10px;padding:6px 10px;font-size:18px}
.restored{padding:10px 14px;margin-bottom:14px;font-weight:900;font-size:14px;background:#E8FFF1}
.actions{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.shot{position:fixed;inset:0;background:rgba(20,20,20,.85);z-index:60;display:flex;flex-direction:column;align-items:center;padding:20px;overflow:auto}
.shot img{max-width:420px;width:100%;border-radius:14px;border:3px solid #fff}
.shot p{color:#fff;font-weight:700;margin:14px 0}
.shot .row{display:flex;flex-wrap:wrap;gap:10px;width:100%;max-width:420px;margin-bottom:6px}
.shot .row .btn{flex:1 1 40%}
.shot img{-webkit-touch-callout:default;user-select:none}
.langs{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;margin:-6px 0 14px}
.langs a{font:800 11.5px var(--sans);color:var(--ink);text-decoration:none;border:2px solid var(--ink);border-radius:999px;padding:3px 6px;background:var(--white)}
.langs a.on{background:var(--ink);color:var(--yellow)}
/* ---------- 结果页精修（只作用于 #poster，不影响分享卡） ---------- */
#poster{background-image:radial-gradient(rgba(20,20,20,.07) 1.1px,transparent 1.1px);background-size:16px 16px}
#poster .p-top{padding:12px 18px;font-size:11px}
#poster .p-sec{margin:14px 14px 0;padding:18px 16px 16px;border-width:2.5px;border-radius:18px;box-shadow:4px 4px 0 var(--ink)}
#poster .p-kicker{display:flex;align-items:center;gap:7px;font-size:10px;letter-spacing:1.4px}
#poster .p-kicker::before{content:"";width:14px;height:4px;border-radius:2px;background:var(--pink)}
#poster .p-sec h4{font-size:22px;line-height:1.2;margin-top:2px}
#poster .p-sec .sub{font-size:11.5px;margin:3px 0 14px}
#poster .p-roast{font-size:17px;font-weight:900;line-height:1.45;margin:14px 0 14px}
/* 顶部数据：从散装标签改成整齐的数据格 */
#poster .chips{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:2.5px solid var(--ink);border-radius:14px;background:var(--white);overflow:hidden;margin-bottom:12px}
#poster .chips span{display:flex;flex-direction:column;gap:2px;border:0;border-radius:0;padding:9px 10px 8px;background:none;font-size:10.5px;font-weight:700;color:var(--muted);border-right:1.5px solid #e6e1d4;border-bottom:1.5px solid #e6e1d4;min-width:0}
#poster .chips span:nth-child(3n){border-right:0}
#poster .chips span b{font:900 15px/1.2 var(--sans);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#poster .chips span.badge{grid-column:1/-1;flex-direction:row;align-items:center;gap:8px;background:#EEF3FF;border-right:0}
#poster .chips span.badge b{font-size:13px}
/* 架构卡 */
#poster .arch-stats{gap:8px}
#poster .arch-stats div{border:0;background:#F6F3EA;border-radius:12px;padding:10px 6px 9px;display:flex;flex-direction:column;justify-content:center}
#poster .arch-stats b{font-size:26px}
#poster .arch-stats span{line-height:1.35;margin-top:2px}
#poster .arch-stats span small{display:block;font-size:9.5px;font-weight:700;opacity:.85}
#poster .lt td.rl b{font-size:10px;letter-spacing:-.2px}
#poster .experts{gap:6px}
#poster .experts span{border-width:1.5px;border-radius:9px;padding:6px 0;font-size:11px}
#poster .ex-legend{display:flex;gap:12px;font-size:10.5px;font-weight:700;color:var(--muted);margin:-2px 0 12px}
#poster .ex-legend i{display:inline-block;width:10px;height:10px;border:1.5px solid var(--ink);border-radius:3px;margin-right:4px;vertical-align:-1px}
#poster .arch-line{font-size:13.5px;line-height:1.6;margin-bottom:14px}
#poster .ladder i{height:10px;border-radius:3px}
/* 人格 */
#poster .p-line{font-size:16px;line-height:1.5;margin:14px 0 4px}
#poster .evidence q{background:#FFF3F9;border-left-color:var(--pink);font-size:13.5px}
#poster .axes{gap:14px 18px;padding:14px 12px;background:#F6F3EA;border-radius:14px;margin-bottom:4px}
#poster .ax .al{flex-wrap:wrap;font-size:10px;margin-bottom:5px}
#poster .ax .al b{order:-1;flex-basis:100%;font-size:12px;margin-bottom:3px}
#poster .ax .track{height:6px;border-width:1.5px;background:#fff}
#poster .ax .track i{width:13px;height:13px}
#poster .trait-row span{border-width:1.5px}
#poster .trait-row span.top{border-width:2px}
#poster .end-row span{border-width:1.5px}
#poster .flavor span{border-width:1.5px}
/* 名场面 */
#poster .scene-log{padding:14px 12px;background:#F6F3EA;border-radius:14px}
#poster .scene-log .msg{border-width:2px;box-shadow:2px 2px 0 var(--ink)}
/* 跑分表：外框粗、内线细、斑马纹 */
#poster .tbl-wrap{margin:0 -4px;border:2.5px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff}
#poster table.lt{border-style:hidden}
#poster .lt th,#poster .lt td{border:1px solid #e3ded1;padding:7px 4px}
#poster .lt tbody tr:nth-child(even) td{background:#FBF9F4}
#poster .lt thead th{background:#F3EFE4;border-bottom:2px solid var(--ink)}
#poster .lt .you{border-left:3px solid var(--pink);border-right:3px solid var(--pink);background:#FFF3F9!important}
#poster .lt thead .you{border-top:0;background:var(--pink-soft)!important}
#poster .lt tr:last-child .you{border-bottom:0}
#poster .lt td.you.win{background:var(--pink-soft)!important}
#poster .lt td.win:not(.you){background:#ECE8DD!important}
#poster .lt td.v{font-size:11px}
/* AA 图：数值放柱顶、柱子圆角、标注不压数字 */
#poster .aa-title{font-weight:700;font-size:20px;margin-top:2px}
#poster .aa-plot{margin-top:40px;gap:4px}
#poster .aa-bar{position:relative;border-radius:5px 5px 1px 1px;padding-top:0;color:transparent;font-size:0}
#poster .aa-bar::before{content:attr(data-v);position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:2px;font:800 9.5px var(--sans);color:var(--ink)}
#poster .aa-col.me .aa-bar::before{font-size:11px;font-weight:900}
#poster .aa-call{margin-bottom:14px}
#poster .aa-labs{gap:4px}
#poster .foot{font-size:10.5px}
/* 已知问题 */
#poster .issues{gap:9px}
#poster .issues li{padding:9px 12px 9px 34px;background:#FFF3F1;border-radius:10px;font-size:13.5px}
#poster .issues li::before{left:11px;top:11px}
#poster .issues.clean li{background:#EEFBF3}
/* 结果页头部：长参数（405B/1.8T）在窄屏上不超框；数据格最后一行不留空格子 */
#poster .p-size{flex-wrap:wrap;row-gap:10px}
#poster .p-size .num{font-size:min(100px,24vw)}
#poster .p-size .lbl{min-width:0;max-width:100%;display:flex;flex-wrap:wrap;align-items:center;column-gap:10px}
#poster .p-size .lbl .sticker{margin-bottom:6px}
#poster .p-size .lbl .sticker{max-width:100%;overflow:hidden;text-overflow:ellipsis}
/* 结果页顶部的分享按钮 */
.actions-top{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 16px}
.actions-top .btn.small{font-size:16px;padding:11px 8px;box-shadow:4px 4px 0 var(--ink)}
.actions-top .wide,.actions-top .share-slot{grid-column:1/-1}
.actions-top .btn.wide{font-size:14px;padding:8px}
.actions-top .share-slot:empty{display:none}
.follow-top{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:#fff;background:var(--ink);border-radius:14px;padding:10px 12px;font-weight:900;font-size:14px;box-shadow:3px 3px 0 var(--pink)}
.follow-top::before{content:"X";display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;background:#fff;color:var(--ink);font:900 12px var(--sans)}
/* 结果页按钮：主次分明 */
.actions .btn.small{font-size:17px;padding:12px 10px}
.actions .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* iOS Safari 会自动放大宽于屏幕的段落文字（html2canvas 导出时在手机宽的框架里重排，540px 宽的分享卡会中招，引用被放大后撑破卡片） */
html,body{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.c34,.c34 *,#poster,#poster *{-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* 恢复进度提示 */
.resume-toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:999px;padding:8px 8px 8px 16px;font-size:13px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25);white-space:nowrap}
.resume-toast button{border:0;border-radius:999px;background:var(--yellow);color:var(--ink);font-weight:900;font-size:12px;padding:5px 10px}
/* 顶栏的小 Jev 图标 */
.jev-bottle{flex:none;margin-left:2px;border:0;background:none;padding:0;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--ink)}
.jev-bottle b{font:900 12px var(--sans);white-space:nowrap;border-bottom:2px solid var(--purple);line-height:1.3}
.jev-bottle.on b{border-bottom-color:transparent;background:var(--purple);border-radius:999px;padding:2px 8px}
.progress .jev-l{position:absolute;inset:0;pointer-events:none;display:block}
.jev-mini{display:inline-block;font:900 13px/1 var(--mono);letter-spacing:-.5px;background:var(--ink);color:#7CF5B4;border-radius:7px;padding:6px 8px;transform:rotate(-3deg);box-shadow:2px 2px 0 var(--pink)}
.jev-bottle:active .jev-mini{transform:rotate(-3deg) translate(1px,1px);box-shadow:1px 1px 0 var(--pink)}
.jev-bottle.new{animation:jevIn .9s ease-out}
@keyframes jevIn{0%{transform:scale(0) rotate(-20deg)}55%{transform:scale(1.15) rotate(8deg)}75%{transform:rotate(-6deg)}100%{transform:none}}
/* Jev 代打 */
.jev-logo{display:inline-block;font:900 30px/1 var(--mono);letter-spacing:-1px;background:var(--ink);color:#7CF5B4;border-radius:12px;padding:8px 14px;transform:rotate(-3deg);box-shadow:4px 4px 0 var(--pink)}
.modal.jev .jev-note{font-size:13px;line-height:1.55;color:var(--muted);background:#F4F2EC;border-radius:10px;padding:8px 10px;margin:-8px 0 16px;text-align:left}
.jev-stream{height:180px;overflow:hidden;background:#141414;color:#7CF5B4;border-radius:12px;padding:10px 12px;font:600 12px/1.7 var(--mono);text-align:left;margin:10px 0 12px}
.jev-stream b{color:#fff}.jev-stream i{color:#8a8f99;font-style:normal;float:right}
.jev-sum{font-weight:900;font-size:15px;margin-bottom:14px}.jev-sum small{font-weight:700;color:var(--muted)}
/* 和 Jev 一起答：Jev 代答时题目锁住，选中项描紫边，下面出输出框 */
.jev-lock{pointer-events:none}
.jev-lock .opt.jev-pick,.jev-lock .jev-pick{outline:4px solid var(--purple);outline-offset:2px;background:#EFE6FF}
.jev-out{margin-top:14px;border:var(--line);border-radius:14px;background:var(--white);padding:10px 12px;box-shadow:4px 4px 0 var(--purple)}
.jev-out .jev-take-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}.jev-out .jev-take-h b{font:400 20px var(--fun)}
.jev-out .jev-take-h small{margin-left:auto;font-weight:800;color:var(--muted);font-size:12px}
.jev-out .jev-stream{height:auto;margin:0;padding:8px 12px}
/* Jev 成批跳的快进卡 */
.jev-ff{cursor:pointer}
.jev-ff .ffq{font-weight:900;font-size:16px;line-height:1.45;min-height:46px;margin:6px 0 10px}
.jev-ff .ffo{display:grid;gap:6px}
.jev-ff .ffo div{border:2px solid var(--ink);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--white)}
.jev-ff .ffo div b{display:inline-block;width:18px}
.jev-ff .ffo div.pick{outline:3px solid var(--purple);outline-offset:1px;background:#EFE6FF}
.jev-ff .jev-out{margin-top:12px}
.jev-ff .jev-take-h b{font-size:17px;white-space:nowrap}.jev-ff .jev-take-h small{white-space:nowrap}
.jev-ff .jev-stream{min-height:96px}
.jev-chip{flex:none;border:2px solid var(--ink);border-radius:999px;background:#141414;color:#7CF5B4;font:900 12px var(--mono);padding:3px 10px;margin-left:8px}
/* ---------- 3:4 分享卡片（540×720，导出 2 倍） ---------- */
.c34-stage{position:fixed;left:-10000px;top:0;display:flex;flex-direction:column;gap:20px}
.c34{width:540px;height:720px;box-sizing:border-box;padding:22px 26px 18px;background:var(--paper);background-image:radial-gradient(rgba(20,20,20,.1) 1.2px,transparent 1.2px);background-size:18px 18px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.c34-top{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:1px}
.c34-top b{flex:1}
.c34-k{font:900 13px var(--mono);background:var(--ink);color:var(--yellow);border-radius:6px;padding:1px 8px}
.c34-body{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;padding-top:12px;padding-bottom:8px}
.c34-foot{display:flex;align-items:center;gap:12px;border-top:3px solid var(--ink);padding-top:10px;margin-top:8px}
.c34-foot b{display:block;font:400 18px var(--fun)}
.c34-foot small{font-size:11px;font-weight:700;color:var(--muted)}
.c34-qr{width:64px;height:64px;flex:none;background:#fff;border:2px solid var(--ink);border-radius:8px;display:grid;place-items:center;overflow:hidden}
.c34-foot.clean{padding-top:12px}
.c34-mark{width:52px;height:52px;flex:none;display:grid;place-items:center;background:var(--ink);color:var(--yellow);border-radius:12px;font:900 20px var(--mono)}
.clean-tip{font-size:13px!important;opacity:.85;margin-top:-6px!important}
.c34-qr img{width:58px;height:58px;image-rendering:pixelated}
.c34-ht > small{font:900 11px var(--mono);letter-spacing:1px;color:var(--muted)}
.c34-h h3{font:400 26px var(--fun);margin:2px 0 4px}
.c34-h p,.c34-sub{font-size:12px;color:var(--muted);font-weight:700;margin:0 0 10px}
.c1-intro{font:400 18px var(--fun)}
.c1-name{font-weight:900;font-size:40px;line-height:1.1;overflow-wrap:anywhere}
.c1-name.long{font-size:30px}
.c1-suf{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.c1-suf span{font:400 19px var(--num);background:var(--yellow);border:2px solid var(--ink);border-radius:8px;padding:0 8px}
.c1-size{display:flex;align-items:flex-end;gap:14px;margin:4px 0 8px}
.c1-size .num{font-family:var(--num);font-size:96px;line-height:.9;color:var(--num-fill,var(--pink));-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink)}
.c1-size .sticker{background:var(--green);transform:rotate(-4deg);margin-bottom:6px}
.c1-arch{font-size:13px;font-weight:900;margin-top:6px}
.c1-aa{border:2.5px solid var(--ink);border-radius:14px;background:#fff;padding:9px 12px 2px;margin:2px 0 10px;box-shadow:3px 3px 0 var(--ink)}
.c1-aa-k{font:700 10.5px var(--serif);color:var(--muted);letter-spacing:.2px}
.c1-aa-h{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;margin:1px 0 0}
.c1-aa-h b{font:400 17px var(--fun)}
.c1-aa-h span{font-weight:700;color:var(--muted);font-size:11.5px}
.mini-aa{position:relative;display:flex;align-items:flex-end;gap:4px;height:82px;margin:34px 0 0 22px;border-bottom:1.5px solid var(--ink)}
.ma-grid{position:absolute;left:0;right:0;border-top:1px dashed #e0dbcf}
.ma-grid span{position:absolute;left:-18px;top:-6px;font:700 8px var(--mono);color:#b3ad9f}
.ma-col{flex:1;height:100%;display:flex;align-items:flex-end;position:relative;z-index:1}
.ma-col i{display:block;width:100%;border-radius:4px 4px 1px 1px;position:relative;min-height:3px}
.ma-col i em{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:1px;font:800 8.5px var(--sans);font-style:normal;color:var(--ink)}
.ma-col.me i{background:var(--pink);border:2px solid var(--ink);border-bottom:0}
.ma-col.me i b{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);white-space:nowrap;font:400 12px var(--fun);background:var(--yellow);border:1.5px solid var(--ink);border-radius:6px;padding:0 5px;margin-bottom:15px;box-shadow:1.5px 1.5px 0 var(--ink)}
.ma-labs{display:flex;gap:4px;margin-left:22px;height:66px}
.ma-lab{flex:1;position:relative}
.ma-lab span{position:absolute;right:50%;top:4px;transform-origin:right center;transform:rotate(-40deg);white-space:nowrap;font:600 8.5px var(--sans);color:#3a372f}
.ma-lab.me span{font-weight:900;color:var(--ink);background:var(--yellow);padding:0 3px;border-radius:2px}
.c1-p{display:flex;align-items:center;gap:10px}
.c1-p .glyph{width:46px;height:46px;font-size:24px;border-radius:12px;box-shadow:3px 3px 0 var(--ink)}
.c1-p b{display:block;font:400 21px var(--fun)}
.c1-p small{font-size:12px;font-weight:900;color:var(--muted)}
.c1-ev{margin:8px 0 10px}
.c1-ev span{font-size:11px;font-weight:900;color:var(--muted)}
.c1-ev q{display:block;font-size:14px;font-weight:700;line-height:1.5;background:var(--c-panel,#F4F2EC);border-left:4px solid var(--ink);border-radius:0 8px 8px 0;padding:5px 10px;quotes:"“" "”"}
.c1-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:auto}
.c1-stats div{border:2px solid var(--ink);border-radius:10px;background:#fff;text-align:center;padding:5px 2px}
.c1-stats b{display:block;font:400 19px var(--num)}
.c1-stats span{font-size:10.5px;font-weight:700;color:var(--muted)}
.c2 table.lt{font-size:11px}
.c2 .lt th,.c2 .lt td{padding:5px 5px}
.c2 .lt td.rl span{font-size:8.5px;margin-top:0}
.c2 .lt td.rl b{font-size:10px}
.c2 .foot{font-size:9.5px;margin-top:6px}
.c34.fit1 .lt th,.c34.fit1 .lt td{padding-top:3px;padding-bottom:3px}
.c34.fit1 .c34-h p{margin-bottom:6px}
.c34.fit2 table.lt{font-size:10px}.c34.fit2 .lt td.rl b{font-size:9px}.c34.fit2 .lt td.rl span{font-size:7.5px}.c34.fit2 .lt td.v{font-size:9.5px}
.c34.fit3 .foot{display:none}
.c1.fit1 .mini-aa{height:78px}.c1.fit1 .c1-size .num{font-size:80px}.c1.fit1 .c1-size{margin:2px 0 6px}
.c1.fit2 .mini-aa{height:70px;margin-top:30px}.c1.fit2 .c1-name{font-size:34px}
.c1.fit3 .c1-aa-k{display:none}.c1.fit3 .c1-suf span{font-size:16px}
.c3 .aa-plot{height:150px;margin:22px 0 0 50px}
.c3 .aa-labs{height:84px;margin-left:50px}
.c3-arch{border-top:2px dashed #bbb;padding-top:8px;margin-top:4px}
.c3-arch > b{font:400 20px var(--fun);display:block}
.c3-arch > span{font-size:11.5px;font-weight:700;color:var(--muted);display:block;margin-bottom:8px}
.c3 .arch-stats b{font-size:20px}
.c4 .axes{margin:4px 0 6px;gap:5px 12px}
.c4 .ax .al{font-size:9.5px;margin-bottom:2px}
.c4 .persona .glyph{width:58px;height:58px;font-size:30px}
.c4 .persona .pn{font-size:22px}
.c4 .p-line{font-size:13.5px;margin:8px 0 2px}
.c4 .evidence{margin:4px 0 4px;gap:4px}
.c4 .evidence q{font-size:12.5px;padding:4px 9px}
.c4 .p-proast{font-size:12px;margin:0 0 6px}
.c4-tags .trait-row span:nth-child(n+6){display:none}
.c4-tags .flavor span:nth-of-type(n+4){display:none}
.c4-tags .flavor b{font-size:16px}
.c4-tags .p-kicker{margin-top:8px!important}
.c4-tags .trait-row span{font-size:11.5px}
.c4-tags .end-row{display:none}
.c5 .c34-body{gap:0}
.c5 .scene-log{flex:1 1 auto;min-height:0;overflow:hidden}
.c5 .scene-log .msg{font-size:12.5px;padding:6px 10px}
.c5 .scene-log .thinkbox{font-size:11px;padding:5px 8px}
.c5-end{flex:none;display:flex;align-items:center;gap:8px;margin:8px 0 8px}
.c5-end .scene-end{font-size:16px}
.c5-end .idtag{margin:0}
.c5-issues{flex:none;border-top:2px dashed #bbb;padding-top:8px}
.c5-issues > b{font:400 18px var(--fun);display:block;margin-bottom:6px}
.c5-issues .issues{gap:5px}
.c5-issues .issues li{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---------- 分享卡精修（搬长图的样式） ---------- */
.c34-ht > small{display:flex;align-items:center;gap:7px;font-size:10.5px;letter-spacing:1.4px}
.c34-ht > small::before{content:"";width:14px;height:4px;border-radius:2px;background:var(--pink)}
.c34-h h3{font-size:25px;line-height:1.15}
.cx{background:#fff;border:2.5px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);padding:12px 14px;flex:none;margin-top:4px}
.c1-stats,.c2 .tbl-wrap,.c1-aa{flex:none}
.c3 .aa-col.me .aa-bar{color:transparent;font-size:0}
/* 第 4 张内容多：放不下时依次收起结局、吐槽、第二句证据 */
.c4.fit1 .c4-tags .end-row{display:none}
.c4.fit2 .p-proast{display:none}
.c4.fit3 .evidence q:nth-of-type(2){display:none}
/* 1：柱状图左侧留够位置给斜着的名字；底部数据改成数据格 */
.c1 .mini-aa{margin-left:40px;height:96px}.c1 .ma-labs{margin-left:40px}
.c1 .ma-grid span{left:-22px}
.c1-stats{gap:0;border:2.5px solid var(--ink);border-radius:14px;background:#fff;overflow:hidden;box-shadow:3px 3px 0 var(--ink)}
.c1-stats div{border:0;border-radius:0;border-right:1.5px solid var(--c-line,#e6e1d4);padding:8px 4px 7px;background:none}
.c1-stats div:last-child{border-right:0}
.c1-stats b{font-size:20px}
.c1-stats span{font-size:10px}
.c1-p{padding:2px 0 10px}
/* 2：跑分表：外框粗、内线细、斑马纹 */
.c2 .tbl-wrap{margin:0;border:2.5px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff;box-shadow:4px 4px 0 var(--ink)}
.c2 table.lt{border-style:hidden}
.c2 .lt th,.c2 .lt td{border:1px solid var(--c-line,#e3ded1)}
.c2 .lt tbody tr:nth-child(even) td{background:var(--c-row,#FBF9F4)}
.c2 .lt thead th{background:var(--c-head,#F3EFE4);border-bottom:2px solid var(--ink)}
.c2 .lt .you{border-left:3px solid var(--pink);border-right:3px solid var(--pink);background:var(--c-soft,#FFF3F9)!important}
.c2 .lt thead .you{border-top:0;background:var(--pink-soft)!important}
.c2 .lt tr:last-child .you{border-bottom:0}
.c2 .lt td.you.win{background:var(--pink-soft)!important}
.c2 .lt td.win:not(.you){background:var(--c-win,#ECE8DD)!important}
.c2 .foot{margin-top:10px}
/* 3：AA 图（数值在柱顶）+ 架构面板 */
.c3 .aa-title{font-weight:700;font-size:21px}
.c3 .aa-plot{margin-top:30px;gap:4px;height:140px}
.c3 .aa-bar{position:relative;border-radius:5px 5px 1px 1px;padding-top:0;color:transparent;font-size:0}
.c3 .aa-bar::before{content:attr(data-v);position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:2px;font:800 10px var(--sans);color:var(--ink)}
.c3 .aa-col.me .aa-bar::before{font-size:11.5px;font-weight:900}
.c3 .aa-call{margin-bottom:14px}
.c3 .aa-labs{gap:4px;height:84px}
.c3 .aa-lab span{transform:rotate(-42deg);font-size:9.5px}
.c3-arch{border-top:2.5px solid var(--ink);margin-top:6px;padding-top:10px}
.c3-arch > b{font-size:19px}
.c3 .arch-stats{gap:8px;margin-bottom:10px}
.c3 .arch-stats div{border:0;background:var(--c-panel,#F6F3EA);border-radius:12px;padding:7px 4px}
.c3 .arch-stats b{font-size:22px}
.c3 .experts{gap:5px;margin-bottom:6px}
.c3 .experts span{border-width:1.5px;border-radius:8px;padding:4px 0;font-size:10.5px}
.c3 .ex-legend{display:flex;gap:12px;font-size:10px;font-weight:700;color:var(--muted);margin-bottom:8px}
.c3 .ex-legend i{display:inline-block;width:9px;height:9px;border:1.5px solid var(--ink);border-radius:3px;margin-right:4px;vertical-align:-1px}
.c3 .ladder{gap:3px}.c3 .ladder i{height:9px}
/* 4：人格：面板 + 灰底轴区 + 解锁结局 */
.c4 .cx{padding:12px 14px 10px;margin-bottom:10px}
.c4 .evidence q{background:var(--c-soft,#FFF3F9);border-left-color:var(--pink)}
.c4 .axes{padding:10px 12px;background:var(--c-panel,#F6F3EA);border-radius:12px;gap:9px 16px;margin:6px 0 0}
.c4 .ax .al{flex-wrap:wrap;font-size:9px;margin-bottom:3px}
.c4 .ax .al b{order:-1;flex-basis:100%;font-size:11px;margin-bottom:1px}
.c4 .ax .track{height:6px;border-width:1.5px;background:#fff}
.c4 .ax .track i{width:12px;height:12px}
.c4-tags .end-row{display:flex}
.c4-tags .end-row span:nth-child(n+5){display:none}
.c4-tags .trait-row span,.c4-tags .end-row span,.c4-tags .flavor span{border-width:1.5px}
/* 5：名场面灰底 + 已知问题浅色行 */
.c5 .scene-log{padding:10px;background:var(--c-panel,#F6F3EA);border-radius:14px}
/* 收小一号：给文字多的语言留余量 */
.c3 .aa-plot{height:128px}.c3 .aa-title{font-size:19px}
.c3-arch > b{font-size:17px}.c3-arch > span{font-size:10.5px;margin-bottom:6px}
.c3 .arch-stats b{font-size:19px}.c3 .arch-stats span{font-size:10px}.c3 .arch-stats div{padding:5px 4px}
.c4 .persona .glyph{width:50px;height:50px;font-size:26px}.c4 .persona .pn{font-size:19px}.c4 .persona .pk{font-size:11.5px;margin-top:3px}
.c4 .p-line{font-size:12.5px;margin:6px 0 2px}
.c4 .evidence q{font-size:11.5px;line-height:1.45;padding:3px 8px}.c4 .evidence span{font-size:10px}
.c4 .p-proast{font-size:11px;line-height:1.45}
.c4 .axes{padding:8px 10px;gap:7px 14px}
.c4-tags .trait-row span{font-size:10.5px}.c4-tags .end-row span{font-size:10.5px}.c4-tags .flavor b{font-size:14.5px}.c4-tags .flavor span{font-size:10.5px}
/* 第 1 张：大数字旁边补小字 */
.c1-size > div:last-child{flex:1;min-width:0}
.c1-roast{font-size:12px;font-weight:700;line-height:1.45;color:var(--muted);margin-top:4px}
.c1-p{gap:10px}
.c1-p > div:nth-child(2){flex:none}
.c1-pline{flex:1;min-width:0;font-size:11.5px;line-height:1.45;font-weight:700;color:var(--muted);border-left:2px solid var(--c-line,#e3ded1);padding-left:10px;margin-left:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.c1.fit2 .c1-pline{display:none}
.c1.fit3 .c1-roast{display:none}
.c5 .scene-log .msg{border-width:2px;box-shadow:2px 2px 0 var(--ink)}
.c5-issues{border-top:0;padding-top:4px}
.c5-issues .issues{gap:6px}
.c5-issues .issues li{padding:6px 10px 6px 30px;background:var(--c-soft2,#FFF3F1);border-radius:9px}
.c5-issues .issues li::before{left:9px;top:8px}
.c5-issues .issues.clean li{background:var(--c-soft3,#EEFBF3)}
/* 卡片标题行右侧的关键数字 */
.c34-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:0 14px}
.c34-ht{flex:1;min-width:0}
.c34-h > p{flex-basis:100%}
.c34-badge{flex:none;text-align:right;margin-bottom:6px;padding-left:12px;border-left:2px solid var(--c-line,#e3ded1)}
.c34-badge span{display:block;font-size:10px;font-weight:900;color:var(--muted);letter-spacing:.5px}
.c34-badge b{display:block;font:400 30px/1 var(--num);color:var(--ink)}
.c34-badge b small{display:inline;font:400 15px var(--num);letter-spacing:0;color:var(--muted);margin-left:1px}
.c3 .aa-title{font-size:18px}
/* 第 1 张：名字右边放 2×2 小数据格 */
.c1-top{display:flex;align-items:flex-start;gap:14px}
.c1-id{flex:1;min-width:0}
.c1-top .c1-stats{flex:none;width:184px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:6px;box-shadow:3px 3px 0 var(--ink)}
.c1-top .c1-stats div{border-right:1.5px solid var(--c-line,#e6e1d4);border-bottom:1.5px solid var(--c-line,#e6e1d4);padding:6px 4px 5px}
.c1-top .c1-stats div:nth-child(2n){border-right:0}
.c1-top .c1-stats div:nth-child(n+3){border-bottom:0}
.c1-top .c1-stats b{font-size:16px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c1-top .c1-stats span{font-size:9.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c1-name{font-size:36px}.c1-name.long{font-size:27px}
.c1 .c34-body{justify-content:space-between}
.c1-p{padding:10px 12px;background:#fff;border:2.5px solid var(--ink);border-radius:14px;box-shadow:3px 3px 0 var(--ink);flex:none}
/* 最后一张：对话小一号、窄一点；架构压成一条 */
.c5 .scene-log{gap:6px;padding:10px 12px}
.c5 .scene-log .msg{font-size:11.5px;line-height:1.45;padding:5px 9px;max-width:76%;border-radius:12px}
.c5 .scene-log .thinkbox{font-size:10px;line-height:1.4;padding:4px 8px;max-width:76%}
.c5-end{margin:8px 0 6px}
.c5-arch{flex:none;display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:6px 10px;margin:0 0 8px;box-shadow:2px 2px 0 var(--ink)}
.c5-arch > b{flex:1;min-width:0;font:400 13.5px/1.25 var(--fun);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c5-arch > div{display:flex;gap:6px;flex:none}
.c5-arch span{display:flex;flex-direction:column;align-items:center;min-width:52px;background:var(--c-panel,#F6F3EA);border-radius:8px;padding:2px 6px;font-size:8.5px;font-weight:700;color:var(--muted)}
.c5-arch span i{font:400 15px/1.1 var(--num);font-style:normal;color:var(--ink)}
/* 最后一张：左边聊天窗口（约 60% 宽），右边竖排信息 */
.c5-main{flex:1 1 auto;min-height:0;display:flex;gap:12px;margin:2px 0 10px}
.c5-chat{flex:0 0 60%;min-height:0;display:flex;flex-direction:column;background:var(--c-panel,#F6F3EA);border:2px solid var(--ink);border-radius:18px;overflow:hidden;box-shadow:3px 3px 0 var(--ink)}
.c5-chat-bar{flex:none;display:flex;gap:4px;padding:6px 10px;background:var(--c-head,#EAE5D7);border-bottom:1.5px solid var(--c-line,#d8d2c1)}
.c5-chat-bar i{width:6px;height:6px;border-radius:50%;background:#bdb6a4}
.c5 .c5-chat .scene-log{flex:1 1 auto;min-height:0;overflow:hidden;background:none;border-radius:0;padding:8px 8px}
.c5 .c5-chat .scene-log .msg{max-width:86%;font-size:11px;padding:5px 8px}
.c5 .c5-chat .scene-log .thinkbox{max-width:86%;font-size:9.5px}
.c5-side{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding-top:4px}
.c5-side .scene-end{margin:0;font-size:14.5px;line-height:1.3;max-width:100%}
.c5-side .idtag{margin:0;font-size:14px}
.c5 .c5-side .c5-arch{margin:auto 0 0;width:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:stretch;gap:5px;padding:8px 10px}
.c5 .c5-side .c5-arch > b{font-size:13px;-webkit-line-clamp:3}
.c5 .c5-side .c5-arch span{flex-direction:row;justify-content:space-between;align-items:baseline;min-width:0;padding:3px 8px;font-size:9.5px}
.c5 .c5-side .c5-arch span i{font-size:15px;order:2}
.cards-shot figure,.poster-shot figure{margin:0 0 16px;width:100%;max-width:420px;text-align:center}
.poster-shot figure{margin-bottom:6px}
.cards-shot figure img,.poster-shot figure img{width:100%;border-radius:12px;border:3px solid #fff}
.poster-shot figure a,.cards-shot figure a{display:inline-block;margin-top:6px;color:#fff;font-weight:700;font-size:13px}
.cap-box{width:100%;max-width:420px;margin-bottom:12px}
.cap-box textarea{width:100%;min-height:90px;border-radius:10px;padding:8px;font:500 13px/1.5 var(--sans)}
.cap-box small{color:#fff;font-size:12px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}

/* 稀有度标签、人格图鉴、隐藏款 */
.rare-tag{display:inline-block;font:900 10px var(--sans);font-style:normal;border:1.5px solid var(--ink);border-radius:999px;padding:0 6px;margin-left:6px;vertical-align:middle;background:#fff;white-space:nowrap}
.rare-tag.rare{background:#FFE14D}.rare-tag.uncommon{background:#E6F4FF}.rare-tag.hid{color:var(--ink);background:linear-gradient(90deg,#FFB8DD,#D8C4FF,#B8D0FF,#B8F0D0)}
.closest{font-size:12px;color:var(--muted);font-weight:700}
.dex{margin:16px 0 4px;padding:12px 14px;border-radius:16px;background:#fff}
.dex-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}.dex-h b{font:400 18px var(--fun)}.dex-h span{font-weight:900;font-size:13px}
.dex-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dex-c{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border:2px dashed #cfc9ba;border-radius:12px;opacity:.55}
.dex-c.on{border-style:solid;border-color:var(--ink);opacity:1}.dex-c.cur{box-shadow:3px 3px 0 var(--ink);background:#FFF7E3}
.dex-g{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font:900 18px var(--num);color:#fff;background:#d9d3c4;border:2px solid var(--ink)}
.dex-c.hid .dex-g{background:linear-gradient(135deg,#FF7EC3,#FFE14D,#43E08B,#6C9BFF,#B78CFF);color:var(--ink)}
.dex-c small{font-size:11px;font-weight:800;text-align:center;line-height:1.2}
.dex p{margin:10px 0 0;font-size:12px;color:var(--muted);font-weight:700;text-align:center}
.c34[data-th="human"]{background-image:linear-gradient(135deg,rgba(255,126,195,.14),rgba(255,225,77,.12) 30%,rgba(67,224,139,.12) 60%,rgba(108,155,255,.14))}
.c34[data-th="human"] .glyph{background:linear-gradient(135deg,#FF7EC3,#FFE14D,#43E08B,#6C9BFF,#B78CFF)!important;color:var(--ink)}
/* 分享卡 3 的图鉴进度条（9 格，最后一格是隐藏款） */
.c4-dex{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;padding:6px 10px;border:2px solid var(--ink);border-radius:12px;background:var(--c-panel,#F6F3EA)}
.c4-dex b{font:400 15px var(--fun);white-space:nowrap}
.c4-dex span{display:flex;gap:4px}
.c4-dex i{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font:900 11px/1 var(--num);font-style:normal;color:#fff;background:#fff;border:1.5px dashed #b9b2a2;color:#b9b2a2}
.c4-dex i.on{border:1.5px solid var(--ink);color:#fff}
.c4-dex i.hid{background:#fff}
.c4-dex i.hid.on{background:linear-gradient(135deg,#FF7EC3,#FFE14D,#43E08B,#6C9BFF,#B78CFF);color:var(--ink)}
.c4-dex i.cur{box-shadow:2px 2px 0 var(--ink)}
.ch-pk{display:flex;align-items:center;justify-content:center;gap:6px;margin:2px 0 8px;font-size:12.5px;font-weight:800;color:var(--muted)}
.ch-pk b{font:400 12px var(--num);color:var(--ink);background:var(--yellow);border:1.5px solid var(--ink);border-radius:5px;padding:0 5px}
/* 好友 PK：发布页横幅（带入场动画）+ 分享卡第 1 张（额外多出的一张） */
.pk-banner{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 14px 12px;margin:0 0 14px;background:#fff;text-align:center;overflow:hidden}
.pk-banner .pk-bk{font:800 11px var(--mono);letter-spacing:.12em;color:var(--muted)}
.pk-banner p{margin:0;font-weight:800;font-size:14px}.pk-banner>small{font-size:12px;color:var(--muted);font-weight:700}
.pkb-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;width:100%}

.x3-sh-copy{border:1.5px solid #1a57d6;color:#1a57d6;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700}
.x3-sh-done{background:#1a57d6;color:#fff;border-radius:999px;padding:7px 22px;font-size:13px;font-weight:900}
